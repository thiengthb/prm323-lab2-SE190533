<span class="material-symbols-outlined text-[20px]">notifications</span>
<span>Nhắc sinh viên</span>
</button>

<script>
  function triggerRemindFeedback() {
    const btn = document.getElementById('btn-remind');
    if (!btn) return;
    
    const originalContent = btn.innerHTML;
    btn.innerHTML = `
      <span class="material-symbols-outlined text-[20px] text-on-primary">check_circle</span>
      <span class="font-body-medium text-body-medium">Đã gửi nhắc nhở</span>
    `;
    btn.classList.add('opacity-90');
    
    setTimeout(() => {
      btn.innerHTML = originalContent;
      btn.classList.remove('opacity-90');
    }, 2200);
  }
</script></main></body></html>
