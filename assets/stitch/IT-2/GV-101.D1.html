<!DOCTYPE html>

<html lang="vi"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        background: "#FAFAFA",
        surface: "#FFFFFF",
        border: "#E4E4E7",
        primary: "#18181B",
        "primary-foreground": "#FAFAFA",
        "on-surface": "#18181B",
        "secondary-text": "#52525B"
      },
      borderRadius: {
        "card": "16px",
        "btn": "12px"
      },
      fontFamily: {
        sans: ["Inter", "sans-serif"]
      }
    }
  }
};</script><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#FAFAFA;color:#18181B;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}body{min-height:max(884px,100dvh);}</style>
</head><body class="bg-[#FAFAFA] flex flex-col min-h-screen text-[#18181B]"><header class="fixed top-0 w-full z-50 pt-safe bg-[#FAFAFA]/90 backdrop-blur-md border-b border-[#E4E4E7]"><div class="h-14 px-4 flex items-center justify-between"><div class="flex items-center gap-2 min-w-0"><button aria-label="Quay lại" class="w-10 h-10 -ml-2 flex items-center justify-center rounded-full text-[#18181B] hover:bg-[#F4F4F5] active:bg-[#E4E4E7] transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="text-[18px] font-semibold text-[#18181B] tracking-tight">Chi tiết slot</h1></div></div></header><main class="flex-1 flex flex-col relative w-full px-4 pt-14 pb-safe bg-[#FAFAFA]"><div class="flex flex-col w-full pb-28">
<!-- Content Container -->
<div class="flex flex-col gap-3.5 pt-3">
<!-- Header Card -->
<div class="bg-white rounded-[16px] border border-[#E4E4E7] p-4 shadow-sm flex flex-col gap-2">
<div class="flex items-start justify-between gap-2">
<div class="flex flex-col min-w-0">
<span class="text-[14px] font-medium text-[#52525B]">Môn học</span>
<h2 class="text-[18px] font-semibold text-[#18181B] mt-0.5">PRM393 - Lập trình di động</h2>
</div>
<div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-[#F4F4F5] text-[#52525B] shrink-0 border border-[#E4E4E7]"><span class="material-symbols-outlined text-[16px]">schedule</span><span class="text-[14px] font-medium leading-none">Sắp tới</span></div>
</div>
</div>
<!-- Clean Icon + Value Card -->
<div class="bg-white rounded-[16px] border border-[#E4E4E7] p-4 shadow-sm flex flex-col divide-y divide-[#E4E4E7]">
<!-- Time -->
<div class="flex items-center gap-3 py-2.5 first:pt-0">
<span class="material-symbols-outlined text-[20px] text-[#52525B]">schedule</span>
<span class="text-[15px] font-medium text-[#18181B]">09:30 – 11:45</span>
</div>
<!-- Course Code -->
<div class="flex items-center gap-3 py-2.5">
<span class="material-symbols-outlined text-[20px] text-[#52525B]">menu_book</span>
<span class="text-[15px] font-medium text-[#18181B]">PRM393</span>
</div>
<!-- Class Code -->
<div class="flex items-center gap-3 py-2.5">
<span class="material-symbols-outlined text-[20px] text-[#52525B]">groups</span>
<span class="text-[15px] font-medium text-[#18181B]">SE1801</span>
</div>
<!-- Room -->
<div class="flex items-center gap-3 py-2.5 last:pb-0">
<span class="material-symbols-outlined text-[20px] text-[#52525B]">location_on</span>
<span class="text-[15px] font-medium text-[#18181B]">P.305</span>
</div>
</div>
<!-- Summary Metric Row -->
<!-- Class Roster Quick Peek -->
</div>
<!-- Fixed Bottom Action Container -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-[#FAFAFA]/95 backdrop-blur-md px-4 py-3 pb-safe border-t border-[#E4E4E7]">
<div class="max-w-md mx-auto w-full">
<button class="w-full h-12 bg-[#E4E4E7] text-[#71717A] opacity-60 cursor-not-allowed font-medium text-[16px] rounded-[12px] flex items-center justify-center gap-2 shadow-sm pointer-events-none focus:outline-none" disabled="" id="btn-attendance" type="button"><span class="material-symbols-outlined text-[20px]">how_to_reg</span><span>Mở điểm danh</span></button>
</div>
</div>
</div>
<script>
  document.getElementById('btn-attendance')?.addEventListener('click', function() {
    const originalText = this.innerHTML;
    this.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>Đang xử lý</span>';
    setTimeout(() => {
      this.innerHTML = originalText;
    }, 800);
  });
</script></main></body></html>
