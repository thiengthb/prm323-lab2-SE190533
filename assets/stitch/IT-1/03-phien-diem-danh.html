<script>
  let secondsLeft = 15;
  const countdownEl = document.getElementById('countdown');
  
  // Timer ticker
  setInterval(() => {
    secondsLeft--;
    if (secondsLeft <= 0) {
      secondsLeft = 15;
    }
    if (countdownEl) {
      countdownEl.textContent = secondsLeft + 's';
    }
  }, 1000);

  let scannedCount = 32;
  let remainingCount = 3;

  function markAttendance(studentId, status, buttonEl) {
    const row = buttonEl.closest('.student-item');
    if (!row) return;

    row.style.opacity = '0.3';
    row.style.pointerEvents = 'none';

    setTimeout(() => {
      row.remove();
      remainingCount = Math.max(0, remainingCount - 1);
      
      if (status === 'present') {
        scannedCount = Math.min(35, scannedCount + 1);
      }

      const scannedEl = document.getElementById('scanned-count');
      const badgeUnscanned = document.getElementById('badge-unscanned');

      if (scannedEl) scannedEl.textContent = scannedCount;
      if (badgeUnscanned) badgeUnscanned.textContent = remainingCount;

      if (remainingCount === 0) {
        const emptyState = document.getElementById('all-marked-empty-state');
        if (emptyState) {
          emptyState.classList.remove('hidden');
          emptyState.classList.add('flex');
        }
      }
    }, 220);
  }

  function finalizeSession() {
    const btn = document.getElementById('btn-submit');
    if (btn) {
      btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>Đang đồng bộ...</span>`;
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">done_all</span><span>Đã lưu thành công</span>`;
      }, 1200);
    }
  }
